# nginx ayarı. "janto.ornek.com" yerine kendi alan adını yaz.
# Dosyalar /var/www/jpage içinde olmalı. Bu dosyayı /etc/nginx/conf.d/jpage.conf olarak kaydet.
# HTTPS için sonra:  sudo certbot --nginx -d janto.ornek.com
# (Certbot sertifikayı alır, 443 ayarını ekler ve yenilemeyi kendisi zamanlar.)
server {
    listen 80;
    listen [::]:80;
    server_name janto.ornek.com;

    root /var/www/jpage;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/manifest+json;

    # Güvenlik başlıkları (location içinde add_header kullanılmadığı için hepsi her yerde geçerli)
    add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://i.ytimg.com; font-src 'self'; media-src 'self'; connect-src 'self'; manifest-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'; frame-ancestors 'none'" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), accelerometer=(), gyroscope=(), magnetometer=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;

    location / {
        try_files $uri $uri/ =404;
    }

    # Önbellek süreleri
    location /fonts/ { expires 1y; }
    location /img/   { expires 7d; }
    location /data/  { expires -1; }   # her seferinde taze oku

    error_page 404 /404.html;

    # Gizli dosyalar ve sunucuya ait olmayan dosyalar dışarı verilmesin
    location ~ /\.(?!well-known) { deny all; }
    location ~ ^/(scripts|deploy|\.github)/ { return 404; }
    location = /README.md { return 404; }
}
