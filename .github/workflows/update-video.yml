name: Son videoyu güncelle

on:
  schedule:
    - cron: "*/15 * * * *"   # her 15 dakikada bir (GitHub en sık 5 dk destekler, yoğunlukta gecikebilir)
  workflow_dispatch:          # Actions sekmesinden elle çalıştırmak için

permissions:
  contents: write

concurrency:
  group: update-video
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: YouTube RSS'ten son videoyu oku
        env:
          CHANNEL_ID: UCRqJVaQLwcT3irYb-ZzcuSw
        run: node scripts/update-video.mjs
      - name: Değişiklik varsa kaydet
        run: |
          if [ -n "$(git status --porcelain data/videos.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/videos.json
            git commit -m "Son video güncellendi"
            git push
          fi
